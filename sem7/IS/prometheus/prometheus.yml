global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # метрики самої БД (через exporter)
  - job_name: postgres
    static_configs:
      - targets: ["postgres_exporter:9187"]

  # метрики мікросервісів
  - job_name: db-service
    metrics_path: /metrics
    static_configs:
      - targets: ["db-service:8000"]

  - job_name: auth-service
    metrics_path: /metrics
    static_configs:
      - targets: ["auth-service:8001"]
