apiVersion: 1

# $$ потрібен, бо Grafana сама підставляє змінні в provisioning

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      # посилання з trace_id у логу на трейс у Tempo
      derivedFields:
        - name: TraceID
          matcherRegex: "trace_id=([0-9a-f]{32})"
          url: "$${__value.raw}"
          datasourceUid: tempo
          urlDisplayLabel: "Відкрити трейс"

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      # зі спана можна перейти до логів у Loki
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-1m"
        spanEndTimeShift: "1m"
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        query: '{service=~".+"} |= "$${__span.traceId}"'
      nodeGraph:
        enabled: true
